{%- assign publications = include.entries -%}
{%- if publications and publications.size > 0 -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "@id": {{ '/publications/' | absolute_url | append: '#publications' | jsonify }},
  "name": "Publications by Steffen Wöll",
  "numberOfItems": {{ publications.size }},
  "itemListElement": [
    {%- for publication in publications %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": {{ publication.schema_type | jsonify }},
        "@id": {{ '/publications/' | absolute_url | append: '#' | append: publication.id | jsonify }},
        "name": {{ publication.title | jsonify }}{% if publication.authors.size > 0 %},
        "author": [
          {%- for author in publication.authors %}
          {
            "@type": "Person",
            {% if author.name == site.seo.person.name %}"@id": {{ '/' | absolute_url | append: '#person' | jsonify }},{% endif %}
            "name": {{ author.name | jsonify }}
          }{% unless forloop.last %},{% endunless %}
          {%- endfor %}
        ]{% elsif publication.editors.size > 0 %},
        "editor": [
          {%- for editor in publication.editors %}
          {
            "@type": "Person",
            {% if editor.name == site.seo.person.name %}"@id": {{ '/' | absolute_url | append: '#person' | jsonify }},{% endif %}
            "name": {{ editor.name | jsonify }}
          }{% unless forloop.last %},{% endunless %}
          {%- endfor %}
        ]{% endif %}{% if publication.date %},
        "datePublished": {{ publication.date | date: '%Y-%m-%d' | jsonify }}{% elsif publication.year %},
        "datePublished": {{ publication.year | append: '' | jsonify }}{% endif %}{% if publication.doi %},
        "identifier": {
          "@type": "PropertyValue",
          "propertyID": "DOI",
          "value": {{ publication.doi | jsonify }}
        }{% endif %}{% if publication.date_created %},
        "dateCreated": {{ publication.date_created | append: '' | jsonify }}{% endif %}{% if publication.date_modified %},
        "dateModified": {{ publication.date_modified | append: '' | jsonify }}{% endif %}{% if publication.start_year %},
        "dateCreated": {{ publication.start_year | append: '' | jsonify }}{% endif %}{% if publication.work_type %},
        "additionalType": {{ publication.work_type | jsonify }}{% endif %}{% if publication.provider.name %},
        "provider": {
          "@type": "Organization",
          "name": {{ publication.provider.name | jsonify }}
        }{% endif %}{% if publication.publisher.name %},
        "publisher": {
          "@type": "Organization",
          "name": {{ publication.publisher.name | jsonify }}
        }{% endif %}{% if publication.item_reviewed.title %},
        "itemReviewed": {
          "@type": "Book",
          "name": {{ publication.item_reviewed.title | jsonify }}{% if publication.item_reviewed.authors.size > 0 %},
          "author": [
            {%- for author in publication.item_reviewed.authors %}
            {
              "@type": "Person",
              "name": {{ author.name | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {%- endfor %}
          ]{% endif %}
        }{% endif %}{% if publication.media.outlet %},
        "isPartOf": {
          "@type": "CreativeWork",
          "name": {{ publication.media.outlet | jsonify }}
        }{% elsif publication.book.title %},
        "isPartOf": {
          "@type": "Book",
          "name": {{ publication.book.title | jsonify }}{% if publication.book.volume %},
          "volumeNumber": {{ publication.book.volume | jsonify }}{% endif %}{% if publication.book.editors.size > 0 %},
          "editor": [
            {%- for editor in publication.book.editors %}
            {
              "@type": "Person",
              "name": {{ editor.name | jsonify }}
            }{% unless forloop.last %},{% endunless %}
            {%- endfor %}
          ]{% endif %}{% if publication.publisher.name %},
          "publisher": {
            "@type": "Organization",
            "name": {{ publication.publisher.name | jsonify }}
          }{% endif %}
        }{% elsif publication.container.title %},
        "isPartOf": {
          "@type": "CreativeWorkSeries",
          "name": {{ publication.container.title | jsonify }}{% if publication.container.volume %},
          "volumeNumber": {{ publication.container.volume | jsonify }}{% endif %}{% if publication.container.issue %},
          "issueNumber": {{ publication.container.issue | jsonify }}{% endif %}
        }{% elsif publication.volume %},
        "volumeNumber": {{ publication.volume | jsonify }}{% endif %}{% if publication.pages.start %},
        "pageStart": {{ publication.pages.start | append: '' | jsonify }}{% if publication.pages.end %},
        "pageEnd": {{ publication.pages.end | append: '' | jsonify }}{% endif %}{% endif %}{% if publication.links.size > 0 %},
        "url": {{ publication.links[0].url | absolute_url | jsonify }}{% if publication.links[0].format == 'pdf' %},
        "encodingFormat": "application/pdf"{% endif %}{% endif %}
      }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
{%- endif -%}
