# --- Basics --- #

title: Dr. Steffen Wöll
description: Postdoctoral Researcher
lang: en
url: "https://steffenwoell.github.io"
baseurl: ""

# --- Structured metadata --- #

seo:
  site_name: "Steffen Wöll"
  site_description: "Research website of Steffen Wöll, covering American Studies, cultural geography, digital humanities, publications, academic activities, and creative work."
  person:
    name: "Steffen Wöll"
    given_name: "Steffen"
    family_name: "Wöll"
    honorific_prefix: "Dr."
    job_title: "Postdoctoral Researcher"
    affiliation: "Leipzig University"
    image: "/img/cat/pro.webp"
    description: "Postdoctoral researcher in American Studies, cultural geography, and digital humanities."
    same_as:
      - "https://orcid.org/0000-0003-1582-6078"
      - "https://www.researchgate.net/profile/Steffen-Woell"
    knows_about:
      - "American Studies"
      - "Cultural Geography"
      - "Digital Humanities"
      - "Critical Cartography"
      - "Archipelagic Studies"
      - "Visual Culture"

# --- Local development options ---
# If hosted locally set url and baseurl (Danger!)

# URL without trailing slash
# url: "https://example.com"

# Should be an empty string
# baseurl: ""

# --- Navbar --- #

navbar-links:
  Publications: "publications/"
  Activities: "activities/"
  Journal: "/journal/"
  Contact: "contact/"
#  More:
#  - Projects: "projects"
#  - Tags: "tags"

# Navbar image, must be square
# Remove for no image
avatar: "/img/cat/pro.webp"

# Logo in top-left corner instead of title text
# title-img: /path/to/image

# --- Footer --- #

# Danger: Do not delete 'name' parameter
author:
name:

# Select active social links
# If adding new link also edit _data/SocialNetworks.yml
social-network-links:
  home:
  email: "steffen.woell@uni-leipzig.de"
  rss: true
  researchgate: Steffen-Woell
  orcid: 0000-0003-1582-6078
  signal: J6925qikJCwVjKCQblj8JTnQyh5LrAchhDIOBDpGwBlRqX1mnpJOkqEIPe6oXkmF
  telegram: steffenwoell
  #instagram: streetart_leipzig/
  #soundcloud: w-a_s

# Share links shown in posts
share-links-active:
  twitter: false
  facebook: false
  linkedin: false

# Format of link to website in footer
url-pretty: "steffenwoell.github.io"

# --- Misc --- #

excerpt_length: 250

# Character used to separate site title and description in HTML and RSS feed title
title-separator: "-"

# Ruby date format
date_format: "%B %-d, %Y"

# Output options
timezone: "Europe/Berlin"
markdown: kramdown
highlighter: rouge
permalink: /:title/
paginate: 15
paginate_path: "journal/page:num"

kramdown:
  input: GFM

# Default YAML values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: false # add social buttons to blog posts
      hide_avatar: true
  -
    scope:
      path: "" # all files
    values:
      layout: "page"
      show-avatar: true

# Use tags on index page & make tags on blog posts clickable
link-tags: true

# Include dot-directories required in the published site
include:
  - .well-known

# Exclude files from production site
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - projects.md
  - _posts/markdown-examples.md

# Include plugins on production site
plugins:
  - jekyll-paginate
  - jekyll-sitemap
